name: Deploy Apps Script

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps-script/**
      - .clasp.json
      - .github/workflows/deploy-apps-script.yml

permissions:
  contents: read

concurrency:
  group: apps-script
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Push to Apps Script
        run: clasp push -f

      - name: Redeploy web app
        env:
          DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "APPS_SCRIPT_DEPLOYMENT_ID repository variable is not set." >&2
            echo "Set it under Settings > Secrets and variables > Actions > Variables." >&2
            exit 1
          fi
          clasp deploy -i "$DEPLOYMENT_ID" -d "Deploy ${GITHUB_SHA}"
