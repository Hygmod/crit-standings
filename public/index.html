<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2026 Chico Airport Crit Standings</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="standings-shell">
      <header class="standings-header">
        <div class="header-copy">
          <p class="eyebrow">Chico Airport Criterium</p>
          <h1>2026 Crit Standings</h1>
          <p class="meta" id="updated-at">Loading standings...</p>
        </div>
        <a class="team-link" href="https://www.chicocyclingteam.org/airport-crit.html">Back to Airport Crit</a>
      </header>

      <section class="notice" aria-label="Volunteer eligibility note">
        <strong>"V"</strong> as score indicates volunteer duty. <strong>*</strong> Rider has fewer than two volunteer days recorded. <strong>▲▼</strong> show movement since the previous race.
      </section>

      <div class="toolbar">
        <input
          id="rider-search"
          type="search"
          inputmode="search"
          autocomplete="off"
          placeholder="Find a rider by name or number"
          aria-label="Find a rider by name or number">
      </div>

      <section id="standings-tables" aria-live="polite"></section>
      <p id="search-empty" class="empty" role="status" hidden>No riders match your search.</p>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
